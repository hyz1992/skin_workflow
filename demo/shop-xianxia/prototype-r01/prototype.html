position:relative;align-items:center;justify-content:center;width:100%;height:100%;pointer-events:none;transition:transform .12s,filter .12s}.head-button .sprite{width:86px}.pressed>.visual{transform:scale(.94);filter:brightness(1.08)}[data-press]:disabled>.visual{filter:grayscale(.7);opacity:.5}.tabs{position:absolute;top:17.3%;left:50%;transform:translateX(-50%);display:flex;width:828px;gap:0}.tab{position:relative;border:0;padding:0;width:276px;height:69px;background:transparent;color:#e5ddc1}.tab .tab-bg{position:absolute;width:274px;left:1px;top:50%;transform:translateY(-50%)}.tab-content{position:relative;display:flex;gap:17px;align-items:center;justify-content:center;font:700 35px "Songti SC",SimSun,serif;letter-spacing:4px;z-index:1}.tab-content .sprite{width:48px}.tab[data-kind="diamond"] .tab-content .sprite{width:58px}.tab[data-kind="energy"] .tab-content .sprite{width:40px}.tab[aria-selected="true"]{color:#3a2a13}.vip{position:absolute;top:25.5%;left:6.5%;right:6.5%;height:106px;color:#50402a}.vip-back{position:absolute;inset:0;display:flex;align-items:center}.vip-back .sprite{width:100%}.vip-badge{position:absolute;left:4.4%;top:0;width:105px}.vip-number{position:absolute;left:0;right:0;top:32%;text-align:center;font:700 39px Georgia,serif;color:#fff3cb;text-shadow:0 2px 2px #003b37}.vip-copy{position:absolute;left:15%;right:24%;top:22px;font-size:22px;font-weight:650;display:flex;justify-content:space-between;align-items:start;gap:12px;line-height:1.25}.vip-upgrade{text-align:right;max-width:70%;overflow-wrap:anywhere}.vip-track{position:absolute;left:15%;right:24%;top:65px;height:17px;background:#5d5948;border-radius:5px;box-shadow:inset 0 2px 5px #0005;overflow:hidden}.vip-fill{height:100%;width:0;background:linear-gradient(#c8ecd5,#3e9c7f);transition:width .3s}.privilege{position:absolute;right:4%;top:24px;width:193px;height:60px;background:transparent;padding:0;border:0}.privilege .sprite{width:193px}.products{position:absolute;top:39.3%;left:7%;ri px "Songti SC",serif;letter-spacing:5px}.reopen small{display:block;margin-bottom:18px;font:13px system-ui;letter-spacing:4px;color:#8eaaa5}.screen-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}#toast{position:absolute;z-index:10;bottom:12px;left:50%;transform:translateX(-50%);max-width:90%;padding:12px 24px;border:1px solid #b7a46a;border-radius:8px;background:#0b2929f0;color:#f1dfb1;font-size:20px;box-shadow:0 8px 22px #0005;text-align:center}dialog{position:fixed;max-width:calc(100vw - 32px);width:440px;color:#523719;background:#f3e6c8;border:1px solid #bc9557;border-radius:18px;padding:28px;box-shadow:0 20px 100px #0009}dialog::backdrop{background:#031517c9;backdrop-filter:blur(3px)}dialog h2{font:600 27px "Songti SC",SimSun,serif;margin:0 0 16px;letter-spacing:3px}dialog p{line-height:1.8;font-size:16px;margin:12px 0}dialog .muted{font-size:13px;color:#877356}.dialog-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:26px}.dialog-actions button{border-radius:7px;padding:11px 22px;border:1px solid #bea46b;background:transparent;color:#66451c}.dialog-actions .primary{background:#245b51;color:#fff1cb;border-color:#245b51}.dialog-actions .visual{min-height:18px}dialog strong{font-size:26px;color:#93600d}body>footer{max-width:1600px;margin:0 auto 22px;padding:0 28px;display:flex;justify-content:space-between;gap:18px;font-size:12px;color:#76948f}.compact.shop{height:780px;border:2px solid #987e46;border-radius:24px;background:radial-gradient(ellipse at top,#21524d,#103b37 45%,#092c2c);box-shadow:inset 0 0 0 5px #19463e,0 18px 50px #0007}.compact .frame{display:none}.compact .brand{left:30px;top:20px;transform:none;width:140px}.compact .head-button{top:22px;width:56px;height:56px;padding:2px}.compact .head-button .sprite{width:52px}.compact .service{right:82px}.compact .close-shop{right:20px}.compact .promo{top:105px;left:15px;right:15px;text-align:center;font-size:20px;color:#ecd19c;font-weight:500}.compact .tabs{top:150px;width:calc(100% - 24px);gap:4px;justify-content:center}.compact .tab{width:33.33%;max-width:250px;height:58px}.compact .tab .tab-bg{width:100%;left:0}.compact .tab-content{font-size:22px;gap:8px;letter-spacing:1px}.compact .tab-content .sprite{width:27px}.compact .tab[data-kind="diamond"] .tab-content .sprite{width:34px}.compact .tab[data-kind="energy"] .tab-content .sprite{width:24px}.compact .vip{top:230px;left:16px;right:16px;height:108px;background:#ede0bc;border:1px solid #c09e58;border-radius:10px}.compact .vip-back{display:none}.compact .vip-badge{left:10px;top:15px;width:68px}.compact .vip-number{font-size:26px}.compact .vip-copy{left:91px;right:12px;top:14px;display:block;font-size:18px}.compact .vip-level{white-space:nowrap}.compact .vip-upgrade{max-width:none;text-align:left;margin-top:5px;font-size:16px}.compact .vip-track{left:91px;right:147px;top:81px;height:10px}.compact .privilege{right:9px;top:66px;width:125px;height:39px}.compact .privilege .sprite{width:125px}.compact .products{top:358px;left:14px;right:14px;height:374px}.compact .product-track{justify-content:flex-start;gap:16px;padding:0 4px}.compact .footer-note{bottom:14px;font-size:19px;letter-spacing:1px}.compact .hint{bottom:48px;right:24px;font-size:14px}.compact .empty{inset:48% 8% 17%}.compact .empty p{font-size:17px}.long-state .vip-copy{font-size:18px}.compact.long-state .vip-upgrade{font-size:14px;line-height:1.2}.compact.long-state .vip-track{top:89px}.compact.long-state .vip-number{font-size:21px;top:38%}@media(max-width:650px){header{padding:16px;gap:12px}header h1{font-size:20px}nav{gap:8px}nav label{gap:4px}select,.tool{padding:6px 8px}body>footer{padding:0 16px;font-size:11px;line-height:1.6}.stage{border-radius:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.shop{--unit:1}.card{width:calc(232px * var(--unit));height:calc(371px * var(--unit));flex-basis:calc(232px * var(--unit))}.card-content{position:absolute;width:232px;height:371px;left:0;top:0;transform:scale(var(--unit));transform-origin:0 0;isolation:isolate}.products{height:calc(374px * var(--unit))}.product-track{gap:calc(18px * var(--unit))}.compact .vip-upgrade{display:block}.compact .hint{top:338px;bottom:auto;font-size:13px}.hint{pointer-events:none}</style></head><body>
<header><div><h1>修仙商城</h1><p>青玉鎏金 · 商城交互原型</p></div><nav aria-label="原型预览设置"><label>画幅<select id="ratio"><option value="design">母版 20:9</option><option value="16/9">16:9</option><option value="21/9">21:9</option><option value="4/3">4:3</option><option value="9/16">9:16</option><option value="auto">跟随窗口</option></select></label><label>内容<select id="state"><option value="normal">标准</option><option value="long">长文案 / 长数字</option><option value="empty">空商品</option><option value="disabled">购买不可用</option></select></label><button class="tool" id="reset">重置</button></nav></header>
<main class="stage" id="viewport" aria-label="商城预览"><div id="scene"><button id="reopen" class="reopen" hidden><small>仙阁</small>打开商城</button><section class="shop" id="shop" aria-label="充值商城"><div class="frame" data-art="panel"></div><div class="brand" data-art="title" role="img" aria-label="充值"></div><p class="promo">VIP购买金币额外赠送</p><button class="head-button service" data-press id="service" aria-label="联系客服"><span class="visual" data-art="service"></span></button><button class="head-button close-shop" data-press id="close-shop" aria-label="关闭商城"><span class="visual" data-art="close"></span></button><div class="tabs" id="tabs" role="tablist" aria-label="商品分类"></div><section class="vip" aria-label="VIP等级与进度"><div class="vip-back" data-art="vip-band"></div><div class="vip-badge"><span data-art="vip-badge"></span><span class="vip-number" id="badge-level">0</span></div><div class="vip-copy"><span class="vip-level" id="vip-level">VIP等级:0</span><span class="vip-upgrade" id="vip-upgrade">再消耗10钻石升级为VIP1</span></div><div class="vip-track" id="vip-progress" role="progressbar" aria-label="VIP升级进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="vip-fill" id="vip-fill"></div></div><button class="privilege" id="privilege" data-press aria-label="贵族特权"><span class="visual" data-art="privilege"></span></button></section><div id="catalog" role="tabpanel" aria-labelledby="tab-diamond"><div class="products" id="products" tabindex="0" aria-label="钻石商品，支持横向滚动"><div class="product-track" id="product-track"></div></div><section class="empty" id="empty" hidden role="status"><div id="empty-icon"></div><h2 id="empty-title"></h2><p id="empty-copy"></p></section></div><p id="scroll-hint" class="hint" hidden>左右滑动查看更多</p><p class="footer-note">适度娱乐，理性消费。</p></section><div id="toast" role="status" aria-live="polite" hidden></div></div></main>
<footer><span>演示交互 · 不连接账号或支付</span><span id="metrics"></span></footer>
<dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="dialog-actions"><button id="dialog-cancel" data-press><span class="visual">取消</span></button><button id="dialog-confirm" class="primary" data-press><span class="visual">确定</span></button></div></dialog>
<script>
const ASSETS={"panel":{"contentRect":[22,30,1671,845],"pixelSize":[1716,916]},"title":{"contentRect":[189,108,1424,673],"pixelSize":[1774,887]},"service":{"contentRect":[224,146,869,863],"pixelSize":[1317,1194]},"close":{"contentRect":[275,208,760,753],"pixelSize":[1316,1195]},"tab-selected":{"contentRect":[48,110,1991,485],"pixelSize":[2087,753]},"tab-normal":{"contentRect":[29,129,1989,495],"pixelSize":[2048,768]},"icon-diamond":{"contentRect":[101,143,1133,886],"pixelSize":[1355,1161]},"icon-coin":{"contentRect":[211,178,865,844],"pixelSize":[1292,1217]},"icon-energy":{"contentRect":[325,191,735,861],"pixelSize":[1334,1179]},"vip-band":{"contentRect":[25,270,2122,181],"pixelSize":[2172,724]},"vip-badge":{"contentRect":[36,8,1337,1083],"pixelSize":[1410,1115]},"privilege":{"contentRect":[359,137,1438,448],"pixelSize":[2156,729]},"card-base":{"contentRect":[34,32,938,1500],"pixelSize":[1006,1564]},"buy-base":{"contentRect":[140,101,1791,502],"pixelSize":[2071,759]},"gems-small":{"contentRect":[108,125,1086,1015],"pixelSize":[1277,1232]},"gems-single":{"contentRect":[253,149,1040,765],"pixelSize":[1536,1024]},"gems-pair":{"contentRect":[122,126,1193,856],"pixelSize":[1419,1108]},"gems-cluster":{"contentRect":[137,194,1098,817],"pixelSize":[1361,1156]},"gems-pouch":{"contentRect":[50,69,1250,1050],"pixelSize":[1368,1149]}};
const $=id=>document.getElementById(id),shop=$('shop'),scene=$('scene'),viewport=$('viewport'),ratio=$('ratio'),state=$('state');
const baseGoods=[{amount:'10',price:'1',art:'gems-small',width:139},{amount:'30',price:'3',art:'gems-single',width:136},{amount:'60',price:'6',art:'gems-pair',width:166},{amount:'180',price:'18',art:'gems-cluster',width:174},{amount:'300',price:'30',art:'gems-pouch',width:202}];
const categories=[{id:'diamond',label:'钻石',icon:'icon-diamond'},{id:'coin',label:'金币',icon:'icon-coin'},{id:'energy',label:'体力',icon:'icon-energy'}];
let selected='diamond',timer,dialogAction=null,lastFocus=null;
function sprite(key){const a=ASSETS[key],[x,y,w,h]=a.contentRect,[pw,ph]=a.pixelSize;return `<span class="sprite" style="--ratio:${w}/${h};--iw:${pw/w*100}%;--ix:${-x/w*100}%;--iy:${-y/h*100}%"><img src="png/${key}.png" alt="" draggable="false" width="${pw}" height="${ph}"></span>`;}
document.querySelectorAll('[data-art]').forEach(n=>n.innerHTML=sprite(n.dataset.art));
function restore(){document.querySelectorAll('.pressed').forEach(n=>n.classList.remove('pressed'));}
function renderTabs(){
 $('tabs').innerHTML=categories.map(c=>`<button type="button" role="tab" id="tab-${c.id}" aria-controls="catalog" aria-selected="${c.id===selected}" tabindex="${c.id===selected?0:-1}" class="tab" data-kind="${c.id}" data-press><span class="visual"><span class="tab-bg">${sprite(c.id===selected?'tab-selected':'tab-normal')}</span><span class="tab-content">${sprite(c.icon)}<span>${c.label}</span></span></span></button>`).join('');
}
function goods(){return state.value==='long'?baseGoods.map((g,i)=>({...g,amount:['999,999','1,888,888','6,666,666','18,888,888','30,000,000'][i],price:['999.99','1,999','6,999','18,999','30,000'][i]})):baseGoods;}
function renderProducts(){
 const empty=selected!=='diamond'||state.value==='empty';$('products').hidden=empty;$('empty').hidden=!empty;
 $('catalog').setAttribute('aria-labelledby','tab-'+selected);$('products').setAttribute('aria-label',categories.find(c=>c.id===selected).label+'商品，支持横向滚动');
 if(empty){const c=categories.find(c=>c.id===selected);$('empty-icon').innerHTML=sprite(c.icon);$('empty-title').textContent='暂无'+c.label+'商品';$('empty-copy').textContent=state.value==='empty'?'稍后再来看看吧':'敬请期待';$('scroll-hint').hidden=true;return;}
 $('product-track').innerHTML=goods().map((g,i)=>`<article class="card" aria-label="${g.amount}钻石"><div class="card-content"><div class="card-bg">${sprite('card-base')}</div><div class="goods" style="--goods-width:${g.width}px">${sprite(g.art)}</div><h2 class="quantity ${state.value==='long'?'long':''}">${g.amount}<span class="screen-reader">钻石</span></h2><button class="purchase" data-press data-index="${i}" aria-label="${state.value==='disabled'?'暂不可购买':'购买'}${g.amount}钻石，${g.price}元" ${state.value==='disabled'?'disabled':''}><span class="visual">${sprite('buy-base')}<span class="price ${state.value==='long'?'long':''}">${state.value==='disabled'?'暂不可用':'¥'+g.price}</span></span></button></div></article>`).join('');
 $('products').scrollLeft=0;updateScroll();
}
function updateScroll(){requestAnimationFrame(()=>{$('scroll-hint').hidden=$('products').hidden||$('products').scrollWidth<=$('products').clientWidth+2;});}
function renderState(){restore();shop.classList.toggle('long-state',state.value==='long');$('badge-level').textContent=state.value==='long'?'99':'0';$('vip-level').textContent=state.value==='long'?'VIP等级:99':'VIP等级:0';$('vip-upgrade').textContent=state.value==='long'?'再消耗999,999钻石升级为VIP100，解锁更多贵族权益':'再消耗10钻石升级为VIP1';const value=state.value==='long'?72:0;$('vip-fill').style.width=value+'%';$('vip-progress').setAttribute('aria-valuenow',value);renderTabs();renderProducts();}
function selectTab(id,focus=false){selected=id;restore();renderTabs();renderProducts();if(focus)$('tab-'+id).focus();}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-kind]');if(b)selectTab(b.dataset.kind,true);});
$('tabs').addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();const i=categories.findIndex(c=>c.id===selected);selectTab(categories[e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3].id,true);});
function toast(text){clearTimeout(timer);$('toast').textContent=text;$('toast').hidden=false;timer=setTimeout(()=>$('toast').hidden=true,2600);}
function openDialog(title,body,confirm='我知道了',action=null){restore();lastFocus=document.activeElement;$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog-confirm').querySelector('.visual').textContent=confirm;$('dialog-cancel').hidden=!action;dialogAction=action;$('dialog').showModal();$('dialog-confirm').focus();}
function closeDialog(){restore();$('dialog').close();dialogAction=null;if(lastFocus?.isConnected)lastFocus.focus();}
$('dialog-cancel').onclick=closeDialog;$('dialog-confirm').onclick=()=>{const fn=dialogAction;closeDialog();if(fn)fn();};$('dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
$('product-track').onclick=e=>{const button=e.target.closest('.purchase');if(!button||button.disabled)return;const g=goods()[Number(button.dataset.index)];openDialog('购买钻石',`<p>钻石 <strong>${g.amount}</strong></p><p>金额 <strong>¥${g.price}</strong></p><p class="muted">原型演示，不会产生真实交易。</p>`,'演示购买',()=>toast('购买流程演示完成'));};
$('service').onclick=()=>openDialog('联系客服','<p>客服服务暂未接入。</p><p class="muted">当前为商城交互演示。</p>');
$('privilege').onclick=()=>openDialog('贵族特权',`<p>当前等级 <strong>VIP ${state.value==='long'?'99':'0'}</strong></p><p>VIP购买金币额外赠送</p><p class="muted">权益详情将在正式商城中展示。</p>`);
$('close-shop').onclick=()=>{restore();shop.hidden=true;$('reopen').hidden=false;$('reopen').focus();};$('reopen').onclick=()=>{shop.hidden=false;$('reopen').hidden=true;$('close-shop').focus();updateScroll();};
document.addEventListener('pointerdown',e=>{const n=e.target.closest('[data-press]');if(n&&!n.disabled&&(e.pointerType!=='mouse'||e.button===0))n.classList.add('pressed');});
document.addEventListener('pointerout',e=>{const n=e.target.closest('[data-press]');if(n&&!n.contains(e.relatedTarget))n.classList.remove('pressed');});
document.addEventListener('keydown',e=>{const n=e.target.closest('[data-press]');if(n&&!n.disabled&&(e.key===' '||e.key==='Enter'))n.classList.add('pressed');});
document.addEventListener('focusout',e=>e.target.closest('[data-press]')?.classList.remove('pressed'));
['pointerup','pointercancel','keyup','blur'].forEach(type=>window.addEventListener(type,restore));document.addEventListener('visibilitychange',restore);
$('products').addEventListener('wheel',e=>{if($('products').scrollWidth>$('products').clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();$('products').scrollLeft+=e.deltaY;}},{passive:false});
